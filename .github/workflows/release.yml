name: provider-release
# Build + signe GPG + GitHub Release PUIS enregistre la version sur le registry HCP
# privé via l'API (provider privé ≠ modules : pas de VCS auto-ingest).
# Aucun runner GitHub-hosted : la publication nominale reste locale et ce workflow
# de secours utilise exclusivement le runner de release AISIA auto-hébergé.
on:
  push:
    tags: ['v*']
  # 2026-10-26 : rejouer la release d'un tag déjà poussé (le workflow était sauté
  # depuis la 6.14.20, voir runs-on). Le tag reste la seule source du binaire.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (vX.Y.Z), déjà présent sur le dépôt"
        required: true
concurrency:
  group: github-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  goreleaser:
    if: vars.AISIA_RELEASE_RUNNER_ENABLED == 'true'
    permissions:
      contents: write
    # Runner de release réel : label aisia-release (ARM64), en ligne, qui a signé
    # 6.14.18 et 6.14.19. Le runner X64 prévu le 2026-10-23 n'a jamais
    # été installé : depuis, chaque release du provider était sautée (fondateur,
    # 2026-10-26 : revenir à ce runner ARM64). goreleaser compile toutes les cibles.
    runs-on: [self-hosted, Linux, ARM64, aisia-release]
    timeout-minutes: 30
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.26' }
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with: { version: '~> v2', args: 'release --clean' }
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v6.9.85 — passphrase dispo pour la signature loopback non-interactive (.goreleaser.yml)
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
      # --- Publication HCP (provider privé = API). Skip propre si TF_API_TOKEN absent. ---
      - name: Publish version to HCP private registry
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          export VERSION="${TAG#v}"   # vX.Y.Z -> X.Y.Z
          chmod +x scripts/publish-hcp.sh
          ./scripts/publish-hcp.sh
