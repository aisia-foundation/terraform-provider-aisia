name: provider-test
on:
  push: { paths: ['**.go', 'go.mod', 'go.sum'] }
  pull_request: { paths: ['**.go', 'go.mod', 'go.sum'] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.22' }
      - run: go mod tidy
      # 2026-08-09 — check non mutant (un job CI ne doit jamais réécrire les sources)
      - run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; echo '::error::gofmt drift — run `gofmt -s -w .` locally'; exit 1; }
      - run: go vet ./...
      - run: go build ./...
