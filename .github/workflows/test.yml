name: provider-test
on:
  push: { paths: ['**.go', 'go.mod', 'go.sum'] }
  pull_request: { paths: ['**.go', 'go.mod', 'go.sum'] }
  workflow_dispatch:
concurrency:
  group: github-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  build:
    if: vars.AISIA_SELF_HOSTED_ENABLED == 'true'
    # Politique AISIA : aucun runner GitHub-hosted, même dans le dépôt provider
    # publié séparément. Le label aisia-ci cible le runner organisationnel géré.
    runs-on: [self-hosted, Linux, X64, aisia-ci-container]
    timeout-minutes: 15
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.26' }
      - run: go mod tidy
      # 2026-08-09 — check non mutant (un job CI ne doit jamais réécrire les sources)
      - run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; echo '::error::gofmt drift — run `gofmt -s -w .` locally'; exit 1; }
      - run: go vet ./...
      - run: go build ./...
